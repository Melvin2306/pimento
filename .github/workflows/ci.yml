name: CI

on:
  push:
    branches: [main, cross-platform]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: ShellCheck
        run: |
          shellcheck --version
          # install.sh is POSIX sh (it runs as `curl … | sh`): checked as such.
          shellcheck --shell=sh scripts/install.sh
          shellcheck --severity=warning scripts/*.sh
          # And it parses with the shells it will meet as sh.
          sh -n scripts/install.sh
          bash --posix -n scripts/install.sh

  build-and-test:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # bundle.sh derives the build number from the commit count
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Build (app, CLI, core)
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle (universal)
        run: |
          scripts/bundle.sh --zip
          plutil -lint build/Pimento.app/Contents/Info.plist
          lipo -archs build/Pimento.app/Contents/MacOS/Pimento | grep -q arm64
          lipo -archs build/Pimento.app/Contents/MacOS/Pimento | grep -q x86_64
          test -f build/Pimento.app/Contents/Resources/AppIcon.icns
          test -x build/Pimento.app/Contents/MacOS/Pimento
          build/Pimento.app/Contents/Helpers/pimento version
          build/Pimento.app/Contents/Helpers/pimento help >/dev/null
          # 0.1.0's flags on the app binary are handed to the bundled CLI.
          build/Pimento.app/Contents/MacOS/Pimento --version
      - name: Disk image
        # Builds, verifies, attaches (-nobrowse) and checks build/Pimento-<version>.dmg.
        run: scripts/make-dmg.sh
      - name: Package the CLI on its own (universal)
        run: |
          scripts/package-cli.sh
          tarball="$(ls build/pimento-cli-*-macos.tar.gz)"
          tar -tzf "$tarball"
          mkdir -p build/cli-check && tar -xzf "$tarball" -C build/cli-check
          bin="$(ls build/cli-check/*/pimento)"
          lipo -archs "$bin" | grep -q arm64
          lipo -archs "$bin" | grep -q x86_64
          "$bin" version
          # Linked against Foundation and system libraries only: no AppKit/SwiftUI.
          ! otool -L "$bin" | grep -E 'AppKit|SwiftUI|UserNotifications'
      - name: Installer (install.sh against the packaged CLI)
        run: scripts/test-install.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Pimento-app
          path: |
            build/Pimento-*.zip
            build/Pimento-*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pimento-cli
          path: build/pimento-cli-*-macos.tar.gz
          if-no-files-found: error

  # The CLI and the core on Linux (the app is macOS-only and not declared there).
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Jammy: the packaged binary then runs on glibc 2.35 and later.
    # Pinned by digest (the multi-arch index of swift:6.4.1-jammy): a re-pushed tag cannot change it.
    container: swift:6.4.1-jammy@sha256:64945e64b1e9d16eaf23414f8bcb9b880d12705bb34ad5d23180b04ad6d28e10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Build the CLI
        run: swift build --product pimento
      - name: Test
        run: swift test
      - name: Package the CLI
        run: |
          scripts/package-cli.sh
          tarball="$(ls build/pimento-cli-*-linux-x86_64.tar.gz)"
          tar -tzf "$tarball"
          mkdir -p build/cli-check && tar -xzf "$tarball" -C build/cli-check
          bin="$(ls build/cli-check/*/pimento)"
          "$bin" version
          "$bin" help >/dev/null
          # The Swift runtime is linked in: no libswift*/libFoundation* from the toolchain.
          ldd "$bin"
          ! ldd "$bin" | grep -E 'libswift|libFoundation|libdispatch'
      - name: Installer (install.sh with /bin/sh = dash, against the packaged CLI)
        run: scripts/test-install.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pimento-cli-linux-x86_64
          path: build/pimento-cli-*-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Toolchain
        run: swift --version
      - name: Build the CLI
        run: swift build --product pimento
      - name: Test
        run: swift test
      - name: Package the CLI
        shell: bash
        run: |
          scripts/package-cli.sh
          zip="$(ls build/pimento-cli-*-windows-x86_64.zip)"
          mkdir -p build/cli-check
          powershell.exe -NoProfile -Command "Expand-Archive -Path '$zip' -DestinationPath build/cli-check"
          bin="$(ls build/cli-check/*/pimento.exe)"
          "$bin" version
          "$bin" help >/dev/null
          # Browser sign-in on Windows too, and the device code as the option.
          "$bin" help login | grep -q "Opens your browser"
          "$bin" help login | grep -q -- "--device-code"
          if "$bin" help login | grep -q "no browser sign-in"; then exit 1; fi
          # PowerShell completions: printed by the CLI and shipped in the zip.
          "$bin" completions powershell | grep -q "Register-ArgumentCompleter -Native"
          grep -q "Register-ArgumentCompleter" "$(dirname "$bin")/completions/pimento.ps1"
          "$bin" history --json | grep -q 'AppData'
          # The runner has the Azure CLI (az.cmd) but no session: pimento must find and run it,
          # and fail on the missing login, not with "not found".
          out="$("$bin" status 2>&1)" && exit 1 || true
          echo "$out"
          # `! pipeline` does not trip errexit unless it is the last command: test explicitly.
          if echo "$out" | grep -q "not found"; then exit 1; fi
          echo "$out" | grep -q "az login"
      - name: Installer (install.ps1 with PowerShell 5.1 and 7, against the packaged CLI, with completions)
        shell: pwsh
        run: scripts/test-install.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pimento-cli-windows-x86_64
          path: build/pimento-cli-*-windows-x86_64.zip
          if-no-files-found: error
