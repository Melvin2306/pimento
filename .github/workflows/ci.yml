name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # bundle.sh derives the build number from the commit count
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle
        run: |
          scripts/bundle.sh --zip
          plutil -lint build/Pimento.app/Contents/Info.plist
          test -f build/Pimento.app/Contents/Resources/AppIcon.icns
          build/Pimento.app/Contents/MacOS/pimento --version
      - uses: actions/upload-artifact@v4
        with:
          name: Pimento-app
          path: build/Pimento-*.zip
          if-no-files-found: error
