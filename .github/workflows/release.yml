name: Release

on:
  push:
    # Version tags only (v1.2.3, v1.2.3-rc.1); the macOS job also checks the
    # tag matches AppInfo.version and is on main.
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

# Read-only by default: only the publish job, which runs no build or test
# code, gets a token that can write the release and attest the artifacts.
permissions:
  contents: read

jobs:
  macos:
    name: macOS app and CLI
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag matches AppInfo.version
        run: |
          version="$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' Sources/PimentoCore/AppInfo.swift)"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Check the tagged commit is on main
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main: not released"; exit 1; }
      - name: Test
        run: swift test
      - name: Bundle the app, CLI inside (universal, ad-hoc signed, not notarized)
        run: |
          scripts/bundle.sh --zip
          build/Pimento.app/Contents/Helpers/pimento version
      - name: Disk image (the app and an Applications link)
        run: scripts/make-dmg.sh
      - name: Package the CLI on its own (universal, ad-hoc signed)
        run: scripts/package-cli.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          path: |
            build/Pimento-*.zip
            build/Pimento-*.dmg
            build/pimento-cli-*-macos.tar.gz
          if-no-files-found: error

  linux:
    name: Linux CLI (${{ matrix.runner }})
    strategy:
      matrix:
        # arm64 runners are free for public repositories only.
        runner: ${{ fromJSON(github.event.repository.private && '["ubuntu-latest"]' || '["ubuntu-latest", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # Jammy: the binary runs on glibc 2.35 and later. Pinned by digest (the
    # multi-arch index of swift:6.4.1-jammy): a re-pushed tag cannot change it.
    container: swift:6.4.1-jammy@sha256:64945e64b1e9d16eaf23414f8bcb9b880d12705bb34ad5d23180b04ad6d28e10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Test
        run: swift test
      - name: Package the CLI (Swift runtime linked in)
        run: scripts/package-cli.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-${{ matrix.runner }}
          path: build/pimento-cli-*-linux-*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows CLI
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Test
        run: swift test
      - name: Package the CLI (with the Swift runtime DLLs)
        shell: bash
        run: scripts/package-cli.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: build/pimento-cli-*-windows-*.zip
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Build provenance attestations (Sigstore via GitHub OIDC).
      id-token: write
      attestations: write
    steps:
      # Only the release notes are read from the repository; nothing from it runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github/release-notes
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: build
          pattern: release-*
          merge-multiple: true
      - name: Stable names
        # The same files without the version, so that
        # https://github.com/OWNER/REPO/releases/latest/download/<name> always works
        # (README links, scripts/install.sh, scripts/install.ps1).
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd build
          cp "Pimento-${version}.dmg" Pimento.dmg
          cp "Pimento-${version}.zip" Pimento.zip
          cp "pimento-cli-${version}-macos.tar.gz" pimento-cli-macos.tar.gz
          for f in "pimento-cli-${version}"-linux-*.tar.gz; do
            cp "$f" "pimento-cli-${f#"pimento-cli-${version}-"}"
          done
          cp "pimento-cli-${version}-windows-x86_64.zip" pimento-cli-windows-x86_64.zip
      - name: Checksums
        # `shell: bash` adds -o pipefail: a failing sha256sum must not hide behind tee.
        shell: bash
        run: |
          cd build
          ls -l
          sha256sum Pimento-*.dmg Pimento-*.zip Pimento.dmg Pimento.zip \
            pimento-cli-*.tar.gz pimento-cli-*.zip | tee SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: build/SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          curated=".github/release-notes/${GITHUB_REF_NAME}.md"
          notes_flags=()
          if [[ -f "$curated" ]]; then
            cp "$curated" build/notes.md
          else
            arm=""
            if ls build/pimento-cli-*-linux-aarch64.tar.gz >/dev/null 2>&1; then
              arm=" (also \`pimento-cli-linux-aarch64.tar.gz\`)"
            fi
            base="https://github.com/${GH_REPO}/releases/latest/download"
            cat > build/notes.md <<NOTES
          ## Download

          - **Mac app**: [Pimento.dmg](${base}/Pimento.dmg) (macOS 14+, Apple silicon and Intel), with the
            \`pimento\` command-line tool inside. Open it and drag Pimento to Applications. It is not
            notarized: on first launch, right-click it and choose **Open**.
          - **Command-line tool**: \`curl -fsSL https://raw.githubusercontent.com/${GH_REPO}/main/scripts/install.sh | sh\`
            (macOS, Linux) or \`irm https://raw.githubusercontent.com/${GH_REPO}/main/scripts/install.ps1 | iex\` (Windows),
            or download \`pimento-cli-macos.tar.gz\`, \`pimento-cli-linux-x86_64.tar.gz\`${arm} or
            \`pimento-cli-windows-x86_64.zip\` below.

          Each file is here under a stable name and as \`…-${version}…\`. Verify with
          \`shasum -a 256 -c SHA256SUMS.txt --ignore-missing\` (macOS) or \`sha256sum -c SHA256SUMS.txt --ignore-missing\`
          (Linux), and the build provenance with \`gh attestation verify FILE --repo ${GH_REPO}\`.
          NOTES
            notes_flags=(--generate-notes)
          fi
          {
            echo
            echo "### SHA-256"
            echo
            echo '```'
            cat build/SHA256SUMS.txt
            echo '```'
          } >> build/notes.md
          prerelease=()
          [[ "$version" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            build/Pimento-*.dmg build/Pimento-*.zip build/Pimento.dmg build/Pimento.zip \
            build/pimento-cli-*.tar.gz build/pimento-cli-*.zip build/SHA256SUMS.txt \
            --title "Pimento ${version}" \
            --notes-file build/notes.md \
            ${notes_flags[@]+"${notes_flags[@]}"} ${prerelease[@]+"${prerelease[@]}"}
