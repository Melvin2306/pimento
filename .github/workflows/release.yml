name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default: only the publish job, which runs no build or test
# code, gets a token that can write the release.
permissions:
  contents: read

jobs:
  macos:
    name: macOS app and CLI
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag matches AppInfo.version
        run: |
          version="$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' Sources/PimentoCore/AppInfo.swift)"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Test
        run: swift test
      - name: Bundle the app, CLI inside (ad-hoc signed, not notarized)
        run: |
          scripts/bundle.sh --zip
          build/Pimento.app/Contents/Helpers/pimento version
      - name: Package the CLI on its own (universal, ad-hoc signed)
        run: scripts/package-cli.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          path: |
            build/Pimento-*.zip
            build/pimento-cli-*-macos.tar.gz
          if-no-files-found: error

  linux:
    name: Linux CLI (${{ matrix.runner }})
    strategy:
      matrix:
        # arm64 runners are free for public repositories only.
        runner: ${{ fromJSON(github.event.repository.private && '["ubuntu-latest"]' || '["ubuntu-latest", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # Jammy: the binary runs on glibc 2.35 and later.
    container: swift:6.4.1-jammy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Test
        run: swift test
      - name: Package the CLI (Swift runtime linked in)
        run: scripts/package-cli.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-${{ matrix.runner }}
          path: build/pimento-cli-*-linux-*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows CLI
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Test
        run: swift test
      - name: Package the CLI (with the Swift runtime DLLs)
        shell: bash
        run: scripts/package-cli.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: build/pimento-cli-*-windows-*.zip
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: build
          pattern: release-*
          merge-multiple: true
      - name: Checksums
        # `shell: bash` adds -o pipefail: a failing sha256sum must not hide behind tee.
        shell: bash
        run: |
          cd build
          ls -l
          sha256sum Pimento-*.zip pimento-cli-*.tar.gz pimento-cli-*.zip | tee SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          arm=""
          if ls build/pimento-cli-*-linux-aarch64.tar.gz >/dev/null 2>&1; then
            arm=" (also \`linux-aarch64\`)"
          fi
          cat > build/notes.md <<NOTES
          Downloads:

          - **Pimento-${version}.zip**: the Mac app, with the \`pimento\` command-line tool inside
            (Pimento › Install Command Line Tool… puts it on your PATH).
          - **pimento-cli-${version}-macos.tar.gz**: only the command-line tool for macOS (Apple silicon and Intel),
            with shell completions.
          - **pimento-cli-${version}-linux-x86_64.tar.gz**${arm}: the command-line tool for Linux
            (glibc 2.35+, libcurl), with shell completions.
          - **pimento-cli-${version}-windows-x86_64.zip**: the command-line tool for Windows 10/11
            (sign-in with \`pimento login\` uses a device code there).

          Verify with \`shasum -a 256 -c SHA256SUMS.txt --ignore-missing\` (macOS) or
          \`sha256sum -c SHA256SUMS.txt --ignore-missing\` (Linux); on Windows compare
          \`Get-FileHash pimento-cli-${version}-windows-x86_64.zip\` with SHA256SUMS.txt.

          Ad-hoc signed, not notarized: right-click the app and choose Open on first launch, or run
          \`xattr -dr com.apple.quarantine Pimento.app\` (\`xattr -d com.apple.quarantine pimento\` for the CLI).
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            build/Pimento-*.zip build/pimento-cli-*.tar.gz build/pimento-cli-*.zip build/SHA256SUMS.txt \
            --title "Pimento ${version}" \
            --generate-notes \
            --notes-file build/notes.md
